info:
  name: POST /:group_id
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/posts/{{group_id}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "title": "Test Post",
        "descriptions": "Test post in Board Game"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
