info:
  name: POST /:topic_id
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/groups/{{topic_id}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "group_name": "Chess Club"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
