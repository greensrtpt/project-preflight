info:
  name: PUT /:topic_id/:group_id
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}/groups/{{topic_id}}/{{group_id}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "group_name": "Updated Chess Club"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
